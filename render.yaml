services:
  # Backend Service
  - type: web
    name: finalproject-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production

  # Frontend Service
  - type: web
    name: finalproject-frontend
    env: node
    plan: free
    buildCommand: npm install && NODE_OPTIONS="--max-old-space-size=512" npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=512
      - key: REACT_APP_API_URL
        value: https://finalproject-backend.onrender.com 
